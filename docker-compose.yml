services:
  # ---------------------------------------------------------------------------
  # PHP-FPM application container (Laravel 11 / PHP 8.3)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: health_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-health_dashboard}
      DB_USERNAME: ${DB_USERNAME:-health_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    networks:
      - health_net

  # ---------------------------------------------------------------------------
  # Nginx — exposes the backend on http://localhost:9000
  # ---------------------------------------------------------------------------
  web:
    image: nginx:1.27-alpine
    container_name: health_web
    restart: unless-stopped
    ports:
      - "9000:80"
    volumes:
      - ./backend:/var/www
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - health_net

  # ---------------------------------------------------------------------------
  # MySQL 8 database
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: health_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-health_dashboard}
      MYSQL_USER: ${DB_USERNAME:-health_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "33060:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - health_net

  # ---------------------------------------------------------------------------
  # phpMyAdmin (optional, for DB inspection during review) — http://localhost:8080
  # ---------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:5
    container_name: health_pma
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db
    networks:
      - health_net

networks:
  health_net:
    driver: bridge

volumes:
  db_data:
    driver: local
